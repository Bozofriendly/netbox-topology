name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag from pinned versions
        id: v
        run: |
          nb=$(sed -n 's|^FROM ghcr.io/netbox-community/netbox:||p' Dockerfile)
          pl=$(sed -n 's/^netbox-topology-views==//p' plugin_requirements.txt)
          echo "tag=${nb}-${pl}" >> "$GITHUB_OUTPUT"
      - run: bash test.sh local/netbox-topology:ci
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - if: github.ref == 'refs/heads/main'
        run: |
          img=ghcr.io/bozofriendly/netbox-topology
          docker tag local/netbox-topology:ci $img:${{ steps.v.outputs.tag }}
          docker push $img:${{ steps.v.outputs.tag }}
